name: Generate GitHub Stats

on:
workflow_dispatch:
schedule:
- cron: "0 0 * * *"

permissions:
contents: write

jobs:
generate-stats:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Create profile directory
    run: mkdir -p profile

  - name: Download GitHub Stats
    run: |
      curl -L "https://github-readme-stats.vercel.app/api?username=ismail-chahboune&show_icons=true&theme=default&hide_border=true&count_private=true" \
      -o profile/stats.svg

  - name: Download Top Languages
    run: |
      curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=ismail-chahboune&layout=compact&hide_border=true&theme=default" \
      -o profile/top-langs.svg

  - name: Check generated files
    run: |
      ls -lh profile/
      file profile/stats.svg
      file profile/top-langs.svg

  - name: Commit generated files
    uses: EndBug/add-and-commit@v9
    with:
      message: "Add GitHub stats images"
      add: "profile/stats.svg profile/top-langs.svg"
```
